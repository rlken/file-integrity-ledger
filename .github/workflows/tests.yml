name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.9'
          - os: ubuntu-latest
            python-version: '3.14'
          - os: macos-latest
            python-version: '3.14'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m coverage run -m unittest discover -s tests -v
      - run: python -m coverage report
      - run: python scripts/demo.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install 'build>=1.2,<2'
      - run: python -m build
      - name: Install and smoke-test wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/iledger-smoke"
          "$RUNNER_TEMP/iledger-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/iledger-smoke/bin/iledger" --version
          "$RUNNER_TEMP/iledger-smoke/bin/python" -c "from pathlib import Path; Path('evidence').mkdir(); Path('evidence/sample.txt').write_text('sample')"
          "$RUNNER_TEMP/iledger-smoke/bin/iledger" baseline evidence -o baseline.json
          "$RUNNER_TEMP/iledger-smoke/bin/iledger" check baseline.json
